[project]
name = "meetcast-server"
version = "0.1.0"
description = "Newline MeetCast 服务端（16 接口：设备端 3 + 管理端 11 + 免登录 2）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.32",
    "apscheduler>=3.10",
    "qrcode>=8.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[dependency-groups]
dev = []
